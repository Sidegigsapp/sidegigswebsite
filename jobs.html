    <link rel="apple-touch-icon" href="images/fav.png">

    <!-- Primary SEO -->
    <title>Part-Time Jobs Near You – Kerala &amp; India Gigs Map | Sidegigs</title>
    <meta name="description"
        content="See part-time jobs and side gigs on a live map of Kerala and India — Kochi, Kozhikode, Thiruvananthapuram, Bengaluru, Mumbai and more. No interview round. Apply in the Sidegigs app.">
    <meta name="keywords"
        content="sidegigs jobs, part time jobs India, gig jobs Kerala, part time jobs Kochi, part time jobs Bengaluru, weekend jobs India, event jobs India, delivery jobs India, student jobs India, jobs without interview">
    <meta name="author" content="Wrkshift Pvt. Ltd.">
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large">
    <meta name="googlebot" content="index, follow">
    <meta name="theme-color" content="#C3FF00">
    <link rel="canonical" href="https://sidegigs.app/jobs.html">
    <link rel="alternate" hreflang="en-in" href="https://sidegigs.app/jobs.html">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sidegigs.app/jobs.html">
    <meta property="og:title" content="Jobs on Sidegigs – Part-Time &amp; Gig Jobs Across India">
    <meta property="og:description"
        content="See the gigs open right now in cities across India and apply in the Sidegigs app. No interview round.">
    <meta property="og:image" content="https://sidegigs.app/images/og-image.png">
    <meta property="og:image:alt" content="Sidegigs jobs across India">
    <meta property="og:site_name" content="Sidegigs">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Jobs on Sidegigs – Part-Time &amp; Gig Jobs Across India">
    <meta name="twitter:description" content="See the gigs open right now across India and apply in the Sidegigs app.">
    <meta name="twitter:image" content="https://sidegigs.app/images/og-image.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg fixed-top navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="images/logo.svg" alt="Sidegigs Logo" class="navbar-logo">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse ms-auto" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="about.html">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="jobs.html">Jobs</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="career.html">Career</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="mailto:contact@sidegigs.app">Contact us</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button"
                            data-bs-toggle="dropdown" aria-expanded="false">
                            Legal
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                            <li><a class="dropdown-item" href="privacy-policy.html">Privacy Policy</a></li>
                            <li><a class="dropdown-item" href="terms-conditions.html">Terms and Conditions</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Jobs Globe -->
    <main>
        <section class="jobs-section" aria-labelledby="jobsTitle">
            <div class="jobs-stage" id="jobsStage" tabindex="0" role="slider" aria-label="Globe of open gigs. Drag to turn it, scroll or pinch to zoom. Arrow keys turn it, plus and minus zoom."
                aria-valuemin="-180" aria-valuemax="180" aria-valuenow="0">
                <canvas id="jobsGlobe" aria-hidden="true"></canvas>
            </div>
            <div class="jobs-markers" id="jobsMarkers"></div>

            <div class="jobs-intro">
                <span class="jobs-eyebrow"><span class="jobs-live-dot"></span> Live gigs</span>
                <h1 id="jobsTitle">Jobs near you,<br><span class="highlight">all over India.</span></h1>
                <p class="jobs-lead">Short-term work open right now. Pick a place to see what's on, then apply in the
                    app. No interview round.</p>
                <a class="jobs-kerala-link" href="part-time-jobs-kerala.html">Part-time jobs in Kerala <i class="fas fa-arrow-right" aria-hidden="true"></i></a>
                <div class="jobs-stats">
                    <div><strong id="jobsTotal">0</strong><span>open gigs</span></div>
                    <div><strong id="jobsCityCount">0</strong><span>places</span></div>
                </div>
                <div class="jobs-cities" id="jobsCities" aria-label="Places with open gigs"></div>
            </div>

            <aside class="jobs-panel" id="jobsPanel" aria-live="polite" aria-label="Gig details"></aside>

            <div class="jobs-controls" role="group" aria-label="Globe controls">
                <div class="jobs-control-group">
                    <button type="button" data-globe="left" aria-label="Turn west"><i class="fas fa-chevron-left" aria-hidden="true"></i></button>
                    <button type="button" data-globe="right" aria-label="Turn east"><i class="fas fa-chevron-right" aria-hidden="true"></i></button>
                </div>
                <div class="jobs-control-group">
                    <button type="button" data-globe="out" aria-label="Zoom out"><i class="fas fa-minus" aria-hidden="true"></i></button>
                    <button type="button" data-globe="in" aria-label="Zoom in"><i class="fas fa-plus" aria-hidden="true"></i></button>
                </div>
                <div class="jobs-control-group">
                    <button type="button" data-globe="india" class="is-text">India</button>
                    <button type="button" data-globe="world" class="is-text">World</button>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
    <script src="jobs-land.js"></script>
    <script src="jobs.js"></script>
</body>

</html>
